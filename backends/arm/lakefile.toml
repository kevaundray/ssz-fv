name = "SszArm"
version = "0.1.0"
defaultTargets = ["SszArm"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "lnsym"
git = "https://github.com/leanprover/LNSym"
rev = "df80e2f600dc7f2976809829198a1d9fd07cb379"

# Compile the pinned source in this backend's own build directory. Sharing the
# upstream package's artifacts would mix the ARM and x86 Lean toolchains.
[[lean_lib]]
name = "Ssz"
srcDir = "../../vendor/ssz-specs/lean"


[[lean_lib]]
name = "ProofAudit"
srcDir = "../../proofs"

