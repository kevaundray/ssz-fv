name = "SszX86"
version = "0.1.0"
defaultTargets = ["SszX86"]

[leanOptions]
warningAsError = true

[[require]]
name = "Kraken"
git = "https://github.com/AeneasVerif/kraken"
rev = "30f5a5f9f668283a294bf5ec5859e75b47b3a61a"

# Compile the pinned upstream sources into this package's own build directory.
# A path dependency would share incompatible ARM/x86 toolchain artifacts.
[[lean_lib]]
name = "Ssz"
srcDir = "../../vendor/ssz-specs/lean"
# This pinned upstream source targets stable Lean, not Kraken's newer nightly.
# Retain its deprecation diagnostics as warnings; audit_native checks the
# transitive axioms of every refinement regardless of warning classification.
leanOptions = { warningAsError = false }

[[lean_lib]]
name = "ProofAudit"
srcDir = "../../proofs"

